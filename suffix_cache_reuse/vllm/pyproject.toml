[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-scr"
version = "0.2.0"
description = "Suffix Cache Reuse for vLLM: reuse the KV cache of text that survives a context edit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["vllm==0.30.0"]

[project.scripts]
vllm-scr-serve = "vllm_scr.serve:main"

[tool.setuptools]
packages = ["vllm_scr"]

[tool.setuptools.package-data]
vllm_scr = ["_site/sitecustomize.py"]
